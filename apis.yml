- aid: crossenagage:raw-export
  name: CrossEngage Raw Export API
  description: Asynchronous bulk data-out API for user and event data. List and inspect the (S)FTP export
    destinations and CALLBACK webhook destinations configured on the account, list event classes, request
    an export, poll or cancel it. Enforces a deliberate 3-hour freshness gap so late or out-of-order events
    are never skipped. Seven operations, published as an API Blueprint on Apiary.
  humanURL: https://userseventsexportapiv1.docs.apiary.io/
  baseURL: https://api.crossengage.io
