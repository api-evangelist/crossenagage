aid: crossenagage
name: CrossEngage
description: CrossEngage is a Berlin-based customer data and cross-channel marketing platform (a Customer
  Data Platform / CDP) founded in 2015 and backed by Earlybird Venture Capital. It unifies first-party
  customer data into 360-degree profiles, builds no-code predictive AI/ML models for customer lifetime
  value and behavior, manages audiences with drag-and-drop segmentation, and orchestrates real-time cross-channel
  customer journeys across email, push, SMS, WhatsApp and webhooks. Following its acquisition by Spotler,
  the product is sold as Spotler Activate Pro. CrossEngage exposes six REST APIs on api.crossengage.io
  — User Management v1 and v2, Product Feed, Raw Export, Statistics and File Attachments — totalling 37
  operations. Five are published as API Blueprint documents and one (Product Feed) as Swagger 2.0, all
  served from Apiary and embedded in the reference site at api.documentation.crossengage.io. Authentication
  is a static X-XNG-AuthToken header paired with a required X-XNG-ApiVersion header; there is no OAuth
  surface. Product documentation is published at documentation.crossengage.io, which serves a first-party
  llms.txt index of all 219 pages.
