aid: crossenagage
name: CrossEngage
description: >-
  CrossEngage is a Berlin-based customer data and cross-channel marketing
  platform (a Customer Data Platform / CDP) founded in 2015 and backed by
  Earlybird Venture Capital. It unifies first-party customer data into 360-degree
  profiles, builds no-code predictive AI/ML models for customer lifetime value
  and behavior, manages audiences with drag-and-drop segmentation, and
  orchestrates real-time cross-channel customer journeys. Following its
  acquisition by Spotler, the product is offered as Spotler Activate Pro.
  CrossEngage exposes a REST API at api.crossengage.io documented at
  api.documentation.crossengage.io, covering User Management (v1.0 and v2.0),
  Product Feed, File Attachments, Export, and Statistics.
