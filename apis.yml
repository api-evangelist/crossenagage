  name: CrossEngage Statistics API
  description: Synchronous reporting API for story, campaign and message performance. Discover the KPI
    catalogue configured on the account, then request detailed per-entity or overall roll-up statistics
    for up to 30 entities per call. Four operations, published as an API Blueprint on Apiary. Uses the
    Public API key rather than the Master key.
