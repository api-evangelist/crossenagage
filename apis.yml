- aid: crossenagage:product-feed
  name: CrossEngage Product Feed API
  description: Real-time product catalogue API backing message personalization — page through products,
    fetch, upsert and delete by SKU. The only CrossEngage API published as a native Swagger 2.0 document
    rather than an API Blueprint, so its schemas are the provider's own. Four operations. Complements
    the (S)FTP file feed, which the provider recommends for bulk loads. A public Postman collection is
    published for it.
  humanURL: https://productfeedapiv1.docs.apiary.io/
