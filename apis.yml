apis:
- aid: crossenagage:user-management-v2
  name: CrossEngage User Management API v2
  description: 'Asynchronous customer profile API — create, update and delete single users, batch up to
    1,000 users per call, look a user up by id or by email plus business unit, and poll a tracking id
    for terminal status. This is the primary data-in path for the CDP and the version CrossEngage recommends
    over v1. Six operations, published as an API Blueprint on Apiary. Requires the Master API key and
    X-XNG-ApiVersion: 2.'
  humanURL: https://usermanagementv2.docs.apiary.io/
