      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: The id of the user in your database
                email:
                  type: string
                  description: The user's email.
                businessUnit:
                  type: string
                  description: The business unit of the user.
                firstName:
                  type: string
                  description: The user's first name.
                lastName:
                  type: string
                  description: The user's last name.
                birthday:
                  type: string
                  description: The user's birthday.
                gender:
                  type: string
                  description: The user's gender.
                createdAt:
                  type: string
                  description: The date the user was created in your database.
              required:
              - id
              example:
                email: john.doe@crossengage.io
                firstName: John
                lastName: Doe
                birthday: '1982-08-30'
                createdAt: '2015-10-02T08:23:53Z'
                gender: male
                businessUnit: DE
