          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                type: object
                properties:
                  blacklisted:
                    type: boolean
                  optOutAll:
                    type: boolean
                  optOutChannels:
                    type: array
                    items: {}
                example:
                  blacklisted: false
                  optOutAll: false
                  optOutChannels: []
              example:
                blacklisted: false
                optOutAll: false
                optOutChannels: []
        '401':
          description: Wrong or missing credentials
          headers: {}
          content: {}
        '500':
          description: Unknown error on our side
          headers: {}
          content: {}
      summary: Get a user's status
      operationId: GetAUser'sStatus
      description: Check the overall status of a particular user.
      tags:
      - Opt-Out Management
      parameters:
      - name: id
        in: path
        description: The id of the user in your database
        required: true
        x-example: 78ad0e3e-19e6-4ec1-84a7-b2c860c05387
        schema:
          type: string
      - name: X-XNG-ApiVersion
        in: header
        description: e.g. 1
        required: false
        x-example: '1'
        schema:
          type: string
      - name: X-XNG-AuthToken
        in: header
        description: e.g. Your API Key
        required: false
        x-example: Your API Key
        schema:
          type: string
      x-operation-id-source: normalized
